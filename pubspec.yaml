  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/img/logo.png

  # Archivo variable: un solo archivo cubre todos los pesos y anchos que usa
  # la app. Los ejes se piden desde `Tipo`, con FontVariation.
  fonts:
    - family: Archivo
